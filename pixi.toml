[workspace]
name = "glide-slam"
version = "0.1.0"
description = "GLidE-SLAM: ORB-SLAM2 with an OpenGL ES 3.1 compute-shader direct tracker, packaged with pixi"
channels = ["conda-forge"]
platforms = ["linux-aarch64", "linux-64"]

[dependencies]
# --- toolchain ---
c-compiler = "*"
cxx-compiler = "*"
cmake = ">=3.10"
make = "*"
ninja = "*"
pkg-config = "*"

# --- C++ libraries ---
opencv = "4.*"
eigen = "3.4.*"
sdl2 = "*"
glm = "*"
libegl-devel = "*"
libgles-devel = "*"
libopengl-devel = "*"
libglx-devel = "*"
libglvnd-devel = "*"

# --- python side (demo / bench / eval) ---
python = "3.12.*"
numpy = "*"
tyro = "*"
rerun-sdk = "0.37.*"
evo = "1.31.*"
# provides the `hf` CLI used by the _download-data task
huggingface_hub = "*"

[activation.env]
# The GLidE engine always opens two SDL windows and calls eglCreateWindowSurface
# on the X11 handle, even with Viewer.render: 0, so an X display is required.
SDL_VIDEODRIVER = "x11"
# conda-forge ships the glvnd loader but no GPU driver of its own. Point the
# loader at the host ICD directory: it resolves to Mesa v3d on the Raspberry Pi
# and to NVIDIA on a desktop.
__EGL_VENDOR_LIBRARY_DIRS = "/usr/share/glvnd/egl_vendor.d"
# Extra Eigen defines for the vendored g2o; see [target.linux-64.activation.env].
G2O_EIGEN_FLAGS = ""

# The Raspberry Pi 5 session these were written for. On any other host, export
# DISPLAY and XAUTHORITY yourself before calling pixi.
[target.linux-aarch64.activation.env]
DISPLAY = ":0"
XAUTHORITY = "$HOME/.Xauthority"
XDG_RUNTIME_DIR = "/run/user/1000"

[target.linux-64.activation.env]
# g2o and libGLidE_SLAM share g2o's headers, and the root CMakeLists compiles
# the SLAM side with -DEIGEN_DONT_VECTORIZE, which pins EIGEN_MAX_ALIGN_BYTES
# to 0. Both trees also compile with -march=native. On x86-64 that enables AVX,
# so a g2o without the define gets EIGEN_MAX_ALIGN_BYTES = 32 and the two sides
# disagree about how Eigen's buffers are allocated and released. The first
# global bundle adjustment then frees a pointer the other side never allocated
# and mono_tum dies with SIGSEGV inside VertexSE3Expmap::~VertexSE3Expmap.
# aarch64 tops out at 16 bytes, where both sides fall through to plain
# malloc/free, so the Raspberry Pi build never needed this.
G2O_EIGEN_FLAGS = "-DEIGEN_DONT_VECTORIZE -DEIGEN_DISABLE_UNALIGNED_ARRAY_ASSERT"

# ------------------------------------------------------------------------------
# Build
# ------------------------------------------------------------------------------

# Plain shell guards, not pixi inputs/outputs: every artefact below is gitignored
# and pixi's file-change cache does not track gitignored paths reliably.
[tasks._build-dbow2]
cmd = "test -f Thirdparty/DBoW2/lib/libDBoW2.so || (cmake -S Thirdparty/DBoW2 -B Thirdparty/DBoW2/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_PREFIX_PATH=$CONDA_PREFIX && cmake --build Thirdparty/DBoW2/build -j$(nproc))"

[tasks._build-g2o]
cmd = "test -f Thirdparty/g2o/lib/libg2o.so || (cmake -S Thirdparty/g2o -B Thirdparty/g2o/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_PREFIX_PATH=$CONDA_PREFIX -DCMAKE_CXX_FLAGS=\"-DEIGEN_DONT_ALIGN_STATICALLY $G2O_EIGEN_FLAGS\" && cmake --build Thirdparty/g2o/build -j$(nproc))"

[tasks._extract-vocab]
cmd = "test -f Vocabulary/ORBvoc.txt || tar -xzf Vocabulary/ORBvoc.txt.tar.gz -C Vocabulary"

[tasks._build-slam]
cmd = "test -f Examples/Monocular/mono_tum || (cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$CONDA_PREFIX && cmake --build build -j$(nproc))"
depends-on = ["_build-dbow2", "_build-g2o"]

[tasks.build]
depends-on = ["_build-dbow2", "_build-g2o", "_extract-vocab", "_build-slam"]

# ------------------------------------------------------------------------------
# Data
# ------------------------------------------------------------------------------

[tasks._download-data]
cmd = "test -f data/rgbd_dataset_freiburg3_long_office_household/rgb.txt || hf download pablovela5620/glide-slam-example --repo-type dataset --local-dir data"

# ------------------------------------------------------------------------------
# Runs / benchmarking
# ------------------------------------------------------------------------------

[tasks.run-glide]
cmd = "python bench.py --mode glide --runs 1"
depends-on = ["build", "_download-data"]

[tasks.run-orb]
cmd = "python bench.py --mode orb --runs 1"
depends-on = ["build", "_download-data"]

[tasks.bench]
cmd = "python bench.py --mode glide --runs 5 && python bench.py --mode orb --runs 5 && python bench.py --report"
depends-on = ["build", "_download-data"]

[tasks.demo]
cmd = "test -d out/runs/glide-1 || python bench.py --mode glide --runs 1 && mkdir -p out && python -u demo_rerun.py --run-dir out/runs/glide-1 --rr-config.headless --rr-config.save out/glide-tum3.rrd"
depends-on = ["build", "_download-data"]

[tasks.demo-upstream]
cmd = "python bench.py --mode glide --runs 1 --render --run-name upstream-viewer"
depends-on = ["build", "_download-data"]

[tasks.eval]
cmd = "evo_ape tum data/rgbd_dataset_freiburg3_long_office_household/groundtruth.txt out/runs/glide-1/FrameTrajectory.txt -as"
